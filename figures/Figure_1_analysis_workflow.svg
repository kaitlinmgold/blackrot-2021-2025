<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="7in" height="6.125in" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc">
  <title id="title">Primary analytical workflow for five annual black rot field trials</title>
  <desc id="desc">Workflow from five randomized complete block trials and four operational program classes through shared mixed-model structure, endpoint-specific incidence and severity models, bootstrap-calibrated inference, and pooled estimated marginal means.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#56646A"/>
    </marker>
    <style><![CDATA[
      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #1F2A2E; }
      .subtitle { font: 400 23px Arial, Helvetica, sans-serif; fill: #56646A; }
      .stage { fill: #F7F8F7; stroke: #AEB9BD; stroke-width: 2.2; }
      .inner { fill: #FFFFFF; stroke: #CED6D9; stroke-width: 1.8; }
      .stage-head { font: 700 26px Arial, Helvetica, sans-serif; letter-spacing: 1.1px; fill: #2E3B40; }
      .section-head { font: 700 29px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
      .card-head { font: 700 23px Arial, Helvetica, sans-serif; fill: #2E3B40; }
      .body { font: 400 23px Arial, Helvetica, sans-serif; fill: #263238; }
      .body-sm { font: 400 22px Arial, Helvetica, sans-serif; fill: #46545A; }
      .body-xs { font: 400 22px Arial, Helvetica, sans-serif; fill: #56646A; }
      .label { font: 700 22px Arial, Helvetica, sans-serif; letter-spacing: 0.8px; fill: #56646A; }
      .emph { font: 700 23px Arial, Helvetica, sans-serif; fill: #263238; }
      .white-sm { font: 700 22px Arial, Helvetica, sans-serif; fill: #FFFFFF; }
      .year { font: 700 22px Arial, Helvetica, sans-serif; fill: #36454B; }
      .chip { font: 600 22px Arial, Helvetica, sans-serif; fill: #263238; }
      .step { font: 700 22px Arial, Helvetica, sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
      .rule { stroke: #D9DFE1; stroke-width: 1.6; }
      .flow { fill: none; stroke: #56646A; stroke-width: 3.2; marker-end: url(#arrow); }
      .flow-nohead { fill: none; stroke: #56646A; stroke-width: 3.2; }
      .blue-fill { fill: #EFF7FC; stroke: #72ADD0; stroke-width: 2.2; }
      .orange-fill { fill: #FFF5ED; stroke: #E7A274; stroke-width: 2.2; }
    ]]></style>
  </defs>

  <rect width="1600" height="1400" fill="#FFFFFF"/>

  <text x="800" y="60" class="title" text-anchor="middle">Primary analytical workflow for five annual black rot field trials</text>
  <text x="800" y="99" class="subtitle" text-anchor="middle">Field design → operational program classes → endpoint-specific mixed models → pooled inference</text>

  <!-- Stage 1: design and classification -->
  <rect x="70" y="135" width="1460" height="245" rx="16" class="stage"/>
  <circle cx="105" cy="171" r="22" fill="#35464C"/>
  <text x="105" y="172" class="step">1</text>
  <text x="142" y="179" class="stage-head">FIELD TRIALS AND PROGRAM CLASSIFICATION</text>
  <line x1="100" y1="196" x2="1500" y2="196" class="rule"/>

  <rect x="100" y="216" width="605" height="119" rx="12" class="inner"/>
  <text x="124" y="244" class="card-head">Five annual randomized complete-block trials</text>
  <text x="124" y="271" class="body-sm">Programs rerandomized annually • 4 blocks per year</text>

  <!-- Five year tiles with four block markers -->
  <g transform="translate(124,286)">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="91" height="35" rx="8" fill="#EEF1F2" stroke="#BFC8CB"/>
      <text x="45.5" y="23" class="year" text-anchor="middle">2021</text>
      <circle cx="16" cy="46" r="4.5" fill="#68777D"/><circle cx="35" cy="46" r="4.5" fill="#68777D"/><circle cx="55" cy="46" r="4.5" fill="#68777D"/><circle cx="75" cy="46" r="4.5" fill="#68777D"/>
    </g>
    <g transform="translate(105,0)">
      <rect x="0" y="0" width="91" height="35" rx="8" fill="#EEF1F2" stroke="#BFC8CB"/>
      <text x="45.5" y="23" class="year" text-anchor="middle">2022</text>
      <circle cx="16" cy="46" r="4.5" fill="#68777D"/><circle cx="35" cy="46" r="4.5" fill="#68777D"/><circle cx="55" cy="46" r="4.5" fill="#68777D"/><circle cx="75" cy="46" r="4.5" fill="#68777D"/>
    </g>
    <g transform="translate(210,0)">
      <rect x="0" y="0" width="91" height="35" rx="8" fill="#EEF1F2" stroke="#BFC8CB"/>
      <text x="45.5" y="23" class="year" text-anchor="middle">2023</text>
      <circle cx="16" cy="46" r="4.5" fill="#68777D"/><circle cx="35" cy="46" r="4.5" fill="#68777D"/><circle cx="55" cy="46" r="4.5" fill="#68777D"/><circle cx="75" cy="46" r="4.5" fill="#68777D"/>
    </g>
    <g transform="translate(315,0)">
      <rect x="0" y="0" width="91" height="35" rx="8" fill="#EEF1F2" stroke="#BFC8CB"/>
      <text x="45.5" y="23" class="year" text-anchor="middle">2024</text>
      <circle cx="16" cy="46" r="4.5" fill="#68777D"/><circle cx="35" cy="46" r="4.5" fill="#68777D"/><circle cx="55" cy="46" r="4.5" fill="#68777D"/><circle cx="75" cy="46" r="4.5" fill="#68777D"/>
    </g>
    <g transform="translate(420,0)">
      <rect x="0" y="0" width="91" height="35" rx="8" fill="#EEF1F2" stroke="#BFC8CB"/>
      <text x="45.5" y="23" class="year" text-anchor="middle">2025</text>
      <circle cx="16" cy="46" r="4.5" fill="#68777D"/><circle cx="35" cy="46" r="4.5" fill="#68777D"/><circle cx="55" cy="46" r="4.5" fill="#68777D"/><circle cx="75" cy="46" r="4.5" fill="#68777D"/>
    </g>
  </g>

  <path d="M724 275 L785 275" class="flow"/>

  <rect x="810" y="216" width="690" height="119" rx="12" class="inner"/>
  <text x="834" y="244" class="card-head">Year-specific programs assigned to operational classes</text>
  <g transform="translate(837,264)">
    <rect x="0" y="0" width="258" height="29" rx="14.5" fill="#F0F0F0" stroke="#C4C4C4"/>
    <circle cx="18" cy="14.5" r="7" fill="#4D4D4D"/>
    <text x="35" y="21" class="chip">Untreated</text>

    <rect x="277" y="0" width="328" height="29" rx="14.5" fill="#E9F7F2" stroke="#86CDB7"/>
    <rect x="290" y="7.5" width="14" height="14" fill="#009E73"/>
    <text x="316" y="21" class="chip">Biological only</text>

    <rect x="0" y="38" width="258" height="29" rx="14.5" fill="#EAF3F9" stroke="#84B7D5"/>
    <path d="M18 45 L26 60 L10 60 Z" fill="#0072B2"/>
    <text x="35" y="59" class="chip">Mixed</text>

    <rect x="277" y="38" width="328" height="29" rx="14.5" fill="#FFF0E7" stroke="#E7A274"/>
    <path d="M297 45 L305 52.5 L297 60 L289 52.5 Z" fill="#D55E00"/>
    <text x="316" y="59" class="chip">Conventional only</text>
  </g>

  <rect x="100" y="345" width="1400" height="27" rx="13.5" fill="#E8ECEE"/>
  <text x="800" y="365" class="body-xs" text-anchor="middle">66 year-specific programs • 264 plots • final assessment of 19–20 clusters per plot</text>

  <path d="M800 380 L800 414" class="flow"/>

  <!-- Stage 2: shared structure -->
  <rect x="70" y="425" width="1460" height="222" rx="16" class="stage"/>
  <circle cx="105" cy="461" r="22" fill="#35464C"/>
  <text x="105" y="462" class="step">2</text>
  <text x="142" y="469" class="stage-head">SHARED ESTIMAND AND MODEL HIERARCHY</text>
  <line x1="100" y1="486" x2="1500" y2="486" class="rule"/>

  <rect x="100" y="505" width="420" height="107" rx="12" class="inner"/>
  <text x="124" y="534" class="label">SCIENTIFIC TARGET</text>
  <text x="124" y="565" class="body">Average class differences across</text>
  <text x="124" y="592" class="body">the five observed years; year × class</text>

  <rect x="542" y="505" width="424" height="107" rx="12" class="inner"/>
  <text x="566" y="534" class="label">FIXED EFFECTS</text>
  <text x="566" y="574" class="emph">Year + program class + year × class</text>

  <rect x="988" y="505" width="512" height="107" rx="12" class="inner"/>
  <text x="1012" y="534" class="label">RANDOM INTERCEPTS</text>
  <text x="1012" y="565" class="body">Block within year</text>
  <text x="1012" y="592" class="body">Year-specific program identity</text>

  <text x="800" y="635" class="body-xs" text-anchor="middle">Program identity retains heterogeneity among the named programs representing each operational class.</text>

  <!-- fork to endpoint models -->
  <path d="M800 647 L800 675" class="flow-nohead"/>
  <path d="M800 675 L425 675 L425 704" class="flow"/>
  <path d="M800 675 L1175 675 L1175 704" class="flow"/>

  <!-- Stage 3A: incidence -->
  <rect x="70" y="715" width="710" height="382" rx="16" class="blue-fill"/>
  <path d="M86 715 H764 A16 16 0 0 1 780 731 V777 H70 V731 A16 16 0 0 1 86 715 Z" fill="#0072B2"/>
  <circle cx="112" cy="746" r="22" fill="#FFFFFF" opacity="0.22"/>
  <text x="112" y="747" class="step">3A</text>
  <text x="151" y="755" class="section-head">INCIDENCE</text>
  <text x="752" y="753" class="white-sm" text-anchor="end">bounded count outcome</text>

  <text x="98" y="815" class="label">OBSERVED</text>
  <text x="244" y="815" class="emph">Symptomatic clusters / clusters rated</text>
  <text x="244" y="842" class="body-sm">Known denominator: 19–20 clusters per plot</text>
  <line x1="104" y1="861" x2="746" y2="861" class="rule"/>

  <text x="98" y="899" class="label">MODEL</text>
  <text x="244" y="899" class="emph">Beta-binomial GLMM • logit link</text>
  <line x1="104" y1="920" x2="746" y2="920" class="rule"/>

  <text x="98" y="957" class="label">WHY</text>
  <text x="244" y="957" class="body">Extra-binomial similarity within plots</text>
  <rect x="633" y="937" width="113" height="31" rx="15.5" fill="#DDEEF8" stroke="#72ADD0"/>
  <text x="689.5" y="959" class="body-sm" text-anchor="middle">ρ = 0.192</text>
  <line x1="104" y1="979" x2="746" y2="979" class="rule"/>

  <text x="98" y="1016" class="label">INFERENCE</text>
  <text x="244" y="1016" class="body">Class: likelihood-ratio test</text>
  <text x="244" y="1044" class="body">Year × class: efficient-score test</text>
  <text x="244" y="1072" class="body-sm">9,999-refit parametric bootstrap for interaction</text>

  <!-- Stage 3B: severity -->
  <rect x="820" y="715" width="710" height="382" rx="16" class="orange-fill"/>
  <path d="M836 715 H1514 A16 16 0 0 1 1530 731 V777 H820 V731 A16 16 0 0 1 836 715 Z" fill="#D55E00"/>
  <circle cx="862" cy="746" r="22" fill="#FFFFFF" opacity="0.22"/>
  <text x="862" y="747" class="step">3B</text>
  <text x="901" y="755" class="section-head">SEVERITY</text>
  <text x="1502" y="753" class="white-sm" text-anchor="end">continuous plot mean</text>

  <text x="848" y="815" class="label">OBSERVED</text>
  <text x="994" y="815" class="emph">Mean diseased berries (%)</text>
  <text x="994" y="842" class="body-sm">Per cluster; all ratings included, including zeros</text>
  <line x1="854" y1="861" x2="1496" y2="861" class="rule"/>

  <text x="848" y="899" class="label">TRANSFORM</text>
  <text x="1013" y="899" class="emph">z = log[(p + 0.5) / (100.5 − p)]</text>
  <line x1="854" y1="920" x2="1496" y2="920" class="rule"/>

  <text x="848" y="957" class="label">MODEL</text>
  <text x="994" y="957" class="emph">Gaussian mixed model</text>
  <text x="994" y="985" class="body-sm">Multiplicative dispersion: year + program class</text>
  <line x1="854" y1="1000" x2="1496" y2="1000" class="rule"/>

  <text x="848" y="1037" class="label">INFERENCE</text>
  <text x="994" y="1037" class="body">Class and year × class: likelihood-ratio tests</text>
  <text x="994" y="1065" class="body-sm">9,999-refit parametric bootstrap</text>

  <!-- merge to reporting -->
  <path d="M425 1097 L425 1122 L800 1122" class="flow-nohead"/>
  <path d="M1175 1097 L1175 1122 L800 1122 L800 1143" class="flow"/>

  <!-- Stage 4: reporting; wrapped to retain legibility at publication width. -->
  <rect x="70" y="1153" width="1460" height="207" rx="16" fill="#F2F4F4" stroke="#AEB9BD" stroke-width="2.2"/>
  <circle cx="105" cy="1184" r="22" fill="#35464C"/>
  <text x="105" y="1185" class="step">4</text>
  <text x="142" y="1192" class="stage-head">INFERENCE AND REPORTING</text>

  <rect x="100" y="1210" width="410" height="130" rx="11" class="inner"/>
  <text x="120" y="1238" class="label">ANALYSIS DECISION</text>
  <text x="120" y="1290" class="body-sm" style="font-size: 26px"><tspan x="120">Interactions not supported</tspan><tspan x="120" dy="31"> → additive models</tspan></text>

  <path d="M520 1275 L555 1275" class="flow"/>
  <rect x="570" y="1210" width="455" height="130" rx="11" class="inner"/>
  <text x="590" y="1238" class="label"><tspan x="590">POOLED ESTIMATED</tspan><tspan x="590" dy="26"> MARGINAL MEANS</tspan></text>
  <text x="590" y="1290" class="body-xs" style="font-size: 26px"><tspan x="590">Equal year weights •</tspan><tspan x="590" dy="31"> response-scale means + CIs</tspan></text>

  <path d="M1035 1275 L1070 1275" class="flow"/>
  <rect x="1085" y="1210" width="415" height="130" rx="11" class="inner"/>
  <text x="1105" y="1238" class="label">PAIRWISE CLASS CONTRASTS</text>
  <text x="1105" y="1290" class="body-sm" style="font-size: 26px"><tspan x="1105">Six per endpoint •</tspan><tspan x="1105" dy="31"> sequential Holm adjustment</tspan></text>

  <text x="800" y="1388" class="body-xs" text-anchor="middle">GLMM, generalized linear mixed model; CI, confidence interval.</text>
</svg>
